openapi: 3.1.0
info:
  title: Sereno API
  version: "1.0.0"
  description: >
    API do piloto de neuromodulação não invasiva. Contrato é a fonte de verdade.
    Erros seguem problem+json (RFC 9457). O braço do estudo nunca é exposto:
    endpoints de participante recebem apenas um handle de protocolo neutro, e a
    exportação de pesquisa usa braço codificado (A/B).
servers:
  - url: https://api.sereno.example/v1
security:
  - bearerAuth: []
paths:
  /auth/token:
    post:
      summary: Autenticar e obter tokens
      description: >
        Login de staff por senha (argon2). MFA é obrigatório: se o 2º fator ainda não
        estiver ativo, a resposta traz `mfa_enrollment_required` + `enrollment_token`
        (não concede acesso pleno). Se estiver ativo, traz `mfa_required` + `mfa_token`.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginIn' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      summary: Renovar token de acesso
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshIn' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      summary: Revogar o token atual (denylist por jti) — encerra a sessão
      operationId: logout
      description: >
        Revoga o token de acesso apresentado (adiciona seu `jti` à denylist até expirar);
        se um `refresh_token` for enviado, revoga também o seu `jti`. Requer autenticação.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/LogoutIn' } } }
      responses:
        '200': { description: Sessão encerrada (token revogado) }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/mfa/verify:
    post:
      summary: Verificar segundo fator (TOTP) — pesquisador/admin
      operationId: verifyMfa
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MfaIn' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/participant/request-otp:
    post:
      summary: Solicitar código de uso único (OTP) — participante
      operationId: participantRequestOtp
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RequestOtpIn' } } }
      responses:
        '200': { description: "OK (resposta genérica, sem enumeração)" }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/participant/verify-otp:
    post:
      summary: Verificar OTP e emitir token de participante
      operationId: participantVerifyOtp
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerifyOtpIn' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /diary:
    post:
      summary: Registrar entrada do diário de sono (um por dia)
      operationId: addDiaryEntry
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DiaryIn' } } }
      responses:
        '201': { description: Registrado }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /recommendations:
    post:
      summary: Recomendar protocolo por regras (participante)
      description: >
        Motor POR REGRAS, transparente e versionado, restrito à biblioteca validada.
        Os sinais de segurança (evento adverso recente, contraindicação) são resolvidos
        no SERVIDOR — o cliente não os informa. Devolve um handle NEUTRO, idêntico nos dois
        braços (nunca revela a condição). Cada chamada é registrada (recommendation_log) com
        `feature_vector` para ML futuro. ML nunca decide ao vivo.
      operationId: getRecommendation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationRequest' } } }
      responses:
        '201': { description: Recomendação gerada, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /recommendations/{rec_id}/accept:
    post:
      summary: Registrar aceite/recusa da própria recomendação (participante)
      description: >
        Fecha o loop do recomendador para o relatório de coerência. Decisão única
        (409 se já registrada); recomendação de outro participante retorna 404 (anti-IDOR).
      operationId: acceptRecommendation
      parameters:
        - { name: rec_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptRecommendationIn' } } }
      responses:
        '200': { description: Registrado, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptRecommendationOut' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /research/recommendation-coherence:
    get:
      summary: Coerência do recomendador (exploratório, cego)
      description: >
        Relatório CEGO (sem braço) sobre `recommendation_log`: alinhamento objetivo→banda
        e taxa de aceitação. Médias de relaxamento pendem de vínculo recomendação→sessão.
      operationId: getRecommendationCoherence
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationCoherence' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /participants/me/followup:
    post:
      summary: Enviar avaliação de seguimento (PSQI + GAD-7 + SUS + palpite de cegamento)
      operationId: submitFollowup
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FollowupIn' } } }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/FollowupOut' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/me/consent:
    post:
      summary: Registrar consentimento (TCLE)
      operationId: recordConsent
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConsentIn' } } }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentOut' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/me/consent/withdraw:
    post:
      summary: Retirar o consentimento (self-service do titular)
      operationId: withdrawConsent
      description: >
        O próprio participante retira o consentimento (LGPD, Art. 8 §5): marca o consentimento
        ativo como revogado (`revoked_at`), muda o status para `withdrawn` e **encerra a
        participação** — não é possível iniciar novas sessões depois. Auditado, sem PII. A
        **eliminação** dos dados (Art. 18) é direito separado (canal do Encarregado / rota de
        admin); o dado de pesquisa já coletado é retido pseudonimizado (ADR-066). Idempotente
        por estado: retirar de novo devolve 409.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentWithdrawn' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /participants/me/safety-check:
    post:
      summary: Registrar avaliação de SEGURANÇA (PHQ-9) — não é desfecho do estudo
      description: >-
        PHQ-9 aplicado com finalidade de segurança (o protocolo é explícito: não constitui
        desfecho). O item 9 identifica risco de autoextermínio; junto com GAD-7 >= 15, aciona o
        fluxo de encaminhamento — abre uma ficha para a equipe, interrompe a participação no
        protocolo e devolve orientação de cuidado. A resposta **não devolve escore**: um número
        de gravidade na tela do participante, sem profissional junto, seria lido como
        diagnóstico. O escore fica com a equipe.
      operationId: submitSafetyCheck
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SafetyCheckIn' } } }
      responses:
        '201': { description: Registrado, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyCheckOut' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /referrals:
    get:
      summary: Listar fichas de encaminhamento (equipe)
      description: >-
        A "ficha específica" do protocolo, pseudonimizada (código do estudo, motivos, datas,
        situação). Alimenta o relatório parcial ao CEP. Nunca traz braço nem PII.
      operationId: listReferrals
      parameters:
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralPage' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /referrals/{id}/record:
    post:
      summary: Registrar encaminhamento e confirmação de acolhimento
      description: >-
        Documenta a que serviço o participante foi encaminhado e, quando houver, a confirmação
        de acolhimento — os dois passos que o protocolo exige por escrito.
      operationId: recordReferral
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferralRecordIn' } } }
      responses:
        '200': { description: Atualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Referral' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/me/status:
    get:
      summary: Andamento do participante no protocolo (semana, adesão, T2)
      operationId: getMyProgress
      description: >-
        Em que semana o participante está, quantas sessões contaram para a adesão, se a
        avaliação intermediária (T2, 2ª semana) está aberta e se houve descontinuação de
        protocolo. É o que permite convidar para o T2 **na hora certa**. Aplica de passagem a
        regra de adesão da 2ª semana. NÃO revela braço, condição nem escore. Participante
        (`progress:read`).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ParticipantProgress' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /participants/{id}/discontinue:
    post:
      summary: Registrar descontinuação de protocolo (staff)
      operationId: discontinueParticipant
      description: >-
        Os dois critérios de descontinuação que são juízo humano: pedido do participante e
        evento adverso que contraindique a continuidade. O terceiro (adesão < 50% ao final da
        2ª semana) é regra e o servidor a aplica sozinho. Quem descontinua **permanece na
        análise por intenção de tratar** — é o que separa este estado da retirada de
        consentimento. Staff de inscrição (`enroll:write`).
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DiscontinueIn' } } }
      responses:
        '201': { description: Registrada, content: { application/json: { schema: { $ref: '#/components/schemas/Discontinuation' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /discontinuations:
    get:
      summary: Listar descontinuações de protocolo (equipe)
      operationId: listDiscontinuations
      description: >-
        Saídas do protocolo, pseudonimizadas (código do estudo, motivo, contagem que motivou a
        decisão). Alimenta o fluxo de participantes do CONSORT e o relatório parcial ao CEP.
        Nunca traz braço nem PII.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiscontinuationPage' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /discontinuations/evaluate:
    post:
      summary: Aplicar a regra de adesão da 2ª semana a todos os ativos (staff)
      operationId: evaluateDiscontinuations
      description: >-
        Varredura idempotente: descontinua quem, ao final da 2ª semana, concluiu menos de 50%
        das sessões previstas até ali. Existe porque a avaliação preguiçosa (no início de
        sessão e na tela inicial) nunca alcança quem parou de abrir o aplicativo — que é
        exatamente o caso que a regra precisa pegar. Staff de inscrição (`enroll:write`).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DiscontinuationSweep' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /participants/me/baseline:
    post:
      summary: Enviar avaliação de linha de base (PSQI + GAD-7)
      operationId: submitBaseline
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BaselineIn' } } }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/ScoreOut' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /sessions:
    post:
      summary: Iniciar uma sessão
      operationId: startSession
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionIn' } } }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/SessionOut' } } } }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      summary: Listar as sessões DO PRÓPRIO participante
      description: >-
        O histórico de quem pede — o filtro vem do token, nunca de parâmetro. NÃO repete
        identificador do áudio (`content_hash`, handle): dois participantes comparando esses
        valores descobririam que estão em braços diferentes. Responde "o que eu já fiz", não
        "o que eu ouvi".
      operationId: listSessions
      parameters:
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SessionSummaryPage' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /sessions/registry:
    get:
      summary: Registro por sessão do estudo (equipe)
      description: >-
        O que o protocolo manda manter em "Registro e monitoramento": duração das interrupções,
        volume médio e máximo, relaxamento 0–10, adesão e verificação de fones — pseudonimizado
        por `study_code`. NADA do protocolo de áudio sai daqui (nem `protocol_uuid`, nem
        `protocol_hash`, nem a banda): só existem dois protocolos, um por braço, então qualquer
        identificador estável do áudio particionaria os participantes em dois grupos, e saber
        quem está com quem já quebra o cegamento da análise (descegamento tem rito próprio,
        com dois admins). `study_code` inexistente devolve lista vazia, não 404.
      operationId: listSessionRegistry
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - name: study_code
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StaffSessionPage' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /sessions/{id}/complete:
    post:
      summary: Encerrar a sessão (telemetria)
      operationId: completeSession
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionCompleteIn' } } }
      responses:
        '200':
          description: Encerrada
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionCompleteOut' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /sessions/{id}/survey:
    post:
      summary: Enviar micro-questionário pós-sessão
      operationId: submitSurvey
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SurveyIn' } } }
      responses:
        '201': { description: Criado }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /sessions/{id}/audio:
    get:
      summary: Baixar o áudio da sessão (bit-a-bit, sem revelar o braço)
      operationId: getSessionAudio
      description: >
        Transmite o WAV PCM sem perdas da PRÓPRIA sessão do participante autenticado.
        O protocolo (ativo/sham) foi resolvido no servidor e CONGELADO na sessão; nada
        é re-resolvido aqui e nenhum header/metadado revela a condição. Suporta Range
        para retomada. ETag = sha256 do corpo (integridade bit-a-bit) — distinto do
        content_hash, que é a identidade OPACA do protocolo. Cache-Control: private,
        no-store (nenhum intermediário guarda o áudio; a biblioteca local do app é
        cifrada em repouso e não é um cache HTTP — ADR-103).
        Aceita If-None-Match: com o ETag do artefato já guardado, responde 304 sem corpo.
        Se a entrega por URL assinada estiver ligada (AUDIO_DELIVERY=signed-url), responde
        302 com Location para uma URL de curta duração em /audio/{content_hash} (E3/ADR-082).
      parameters:
        - { $ref: '#/components/parameters/PathId' }
        - name: Range
          in: header
          required: false
          schema: { type: string }
          description: 'Faixa de bytes para retomada (ex.: bytes=0-1048575).'
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: >
            ETag do artefato que o cliente já tem. Se ainda for o vigente, a resposta é
            304 sem corpo — é o que permite guardar o áudio uma vez e usá-lo nas 20
            sessões do estudo sem rebaixá-lo (ADR-103).
      responses:
        '200':
          description: |
            Áudio completo, sem perdas, estéreo 16 bits. O formato é o do servidor
            (`AUDIO_FORMAT`, ADR-103): FLAC por padrão — que decodifica para o MESMO PCM
            do WAV, amostra a amostra. O cliente segue o `Content-Type`; o `ETag` é o
            sha256 do corpo servido e muda se o formato mudar.
          headers:
            ETag: { description: sha256 hex do corpo (bit-a-bit), schema: { type: string } }
            Accept-Ranges: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            audio/flac: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
        '206':
          description: Conteúdo parcial (resposta a Range)
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string } }
          content:
            audio/flac: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
        '304':
          description: >
            O artefato que o cliente já guardou continua vigente (resposta a
            If-None-Match). Sem corpo; mesma forma nos dois braços.
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
        '302':
          description: >
            Redireciona para uma URL assinada de curta duração (entrega por URL, E3).
            Só quando AUDIO_DELIVERY=signed-url; caso contrário devolve 200/206.
          headers:
            Location: { description: "URL assinada em /audio/{content_hash}", schema: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '416': { $ref: '#/components/responses/Problem' }
  /audio/{content_hash}:
    get:
      summary: Baixar áudio por URL assinada (capability, sem Authorization)
      operationId: getSignedAudio
      description: >
        Entrega o WAV por URL ASSINADA (E3/ADR-082) — a capability é a própria assinatura,
        não há Authorization. A chave é o content_hash OPACO (já conhecido do cliente; não
        revela ativo/sham). Assinatura/validade inválidas → 403 genérico (sem oráculo).
        Resposta bit-a-bit idêntica à do caminho autenticado; suporta Range. Prepara o
        offload para storage em nuvem (um presign de S3 encaixa nesta mesma forma).
        Por ser público (sem Authorization), é LIMITADO POR TAXA por IP (429) — o único
        endpoint sem token não pode ser um canal livre de varredura de assinatura nem de
        tráfego (ADR-090). A chave de assinatura é ROTACIONÁVEL: URLs já emitidas seguem
        válidas até expirar após a troca (chave anterior aceita só para VERIFICAR).
      parameters:
        - name: content_hash
          in: path
          required: true
          schema: { type: string }
          description: Identidade OPACA do protocolo (sha256 hex) — não revela a condição.
        - name: exp
          in: query
          required: true
          schema: { type: integer }
          description: Expiração (unix epoch) coberta pela assinatura.
        - name: sig
          in: query
          required: true
          schema: { type: string }
          description: HMAC-SHA256 hex de content_hash|exp.
        - name: Range
          in: header
          required: false
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: |
            Áudio completo, sem perdas, estéreo 16 bits. O formato é o do servidor
            (`AUDIO_FORMAT`, ADR-103): FLAC por padrão — que decodifica para o MESMO PCM
            do WAV, amostra a amostra. O cliente segue o `Content-Type`; o `ETag` é o
            sha256 do corpo servido e muda se o formato mudar.
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            audio/flac: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
        '206':
          description: Conteúdo parcial (resposta a Range)
          content:
            audio/flac: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
        '304':
          description: O artefato já guardado continua vigente (If-None-Match).
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '416': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /adverse-events:
    post:
      summary: Registrar evento adverso
      operationId: reportAdverseEvent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdverseEventIn' } } }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/AdverseEventAccepted' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      summary: Listar eventos adversos (equipe)
      description: >-
        Os relatos, pseudonimizados (código do estudo, tipo, gravidade, conduta, desfecho).
        Segurança é desfecho primário e este era o único dado do estudo sem leitura nenhuma —
        havia só o POST. `pending=true` deixa só o que exige ação: moderado/grave ainda sem
        desfecho. Nunca traz braço nem PII.
      operationId: listAdverseEvents
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [mild, moderate, severe] }
        - name: pending
          in: query
          required: false
          description: "só moderado/grave ainda sem desfecho registrado"
          schema: { type: boolean, default: false }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdverseEventPage' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /adverse-events/{id}/outcome:
    post:
      summary: Registrar o desfecho de um evento adverso (equipe)
      description: >-
        Fecha o acompanhamento do evento. A coluna existia desde o ADR-051 e nada a escrevia:
        um evento entrava e nunca era encerrado. Sobrescrever é permitido — um desfecho evolui
        ("em acompanhamento" → "resolvido") — e cada gravação fica na trilha de auditoria,
        que registra QUE houve, não o texto (é dado de saúde).
      operationId: recordAdverseEventOutcome
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdverseEventOutcomeIn' } } }
      responses:
        '200': { description: Registrado, content: { application/json: { schema: { $ref: '#/components/schemas/AdverseEvent' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/{id}/contact:
    post:
      summary: Gravar contato do participante (staff) — PII CIFRADA em repouso
      operationId: storeParticipantContact
      description: >
        Grava nome e e-mail do participante CIFRADOS em repouso (AES-256-GCM), separados
        do dado de pesquisa (LGPD). A chave vem do ambiente/cofre e nunca é versionada.
        A resposta é NEUTRA e nunca ecoa a PII. Pré-requisito para a entrega real de OTP
        por e-mail. Somente staff de inscrição (`enroll:write`).
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContactIn' } } }
      responses:
        '201': { description: Contato gravado (confirmação neutra) }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /participants/{id}/data:
    get:
      summary: Exportar os dados do titular (LGPD/acesso) — admin
      operationId: exportSubjectData
      description: >
        Reúne os dados do participante (com a PII decifrada, pois é o próprio dado dele) para
        atender a um pedido de acesso/portabilidade (LGPD). NUNCA inclui o braço/condição
        (cegamento preservado). Somente admin (`user:manage`). Registrado em auditoria.
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Dados do titular, content: { application/json: { schema: { $ref: '#/components/schemas/SubjectData' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /participants/{id}/erase:
    post:
      summary: Eliminar dados pessoais do titular (LGPD) — admin
      operationId: eraseParticipant
      description: >
        Remove a PII DIRETA (contato cifrado, artefatos de OTP) e marca o participante como
        'withdrawn'. Os dados de pesquisa PSEUDONIMIZADOS são retidos (exceção de pesquisa da
        LGPD; ver ADR-066) e a auditoria append-only NÃO é apagada. Somente admin (`user:manage`).
        Registrado em auditoria.
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Dados pessoais eliminados, content: { application/json: { schema: { $ref: '#/components/schemas/EraseResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /research/participants:
    get:
      summary: Listar participantes (pesquisa) — RBAC, braço codificado
      operationId: researchListParticipants
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResearchPage' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /screening/criteria:
    get:
      summary: Critérios de elegibilidade em vigor (staff)
      operationId: listScreeningCriteria
      description: >
        Catálogo versionado dos critérios do protocolo aprovado: chaves, rótulos e quais são
        DERIVADOS (calculados pelo servidor a partir dos escores, nunca declarados pelo
        formulário). Somente staff de inscrição (`enroll:write`).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScreeningCriteria' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /screening:
    post:
      summary: Triagem/elegibilidade do participante (staff) — ordena o funil de inscrição
      operationId: recordScreening
      description: >
        Registra a triagem: o servidor calcula a elegibilidade por regra transparente e
        versionada (todas as inclusões verdadeiras E nenhuma exclusão presente) e grava
        critérios + decisão. As chaves são as do protocolo aprovado e o conjunto é FECHADO —
        critério faltando, desconhecido ou derivado declarado é 422. É pré-condição, junto ao
        consentimento, para a alocação. Somente staff de inscrição (`enroll:write`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScreeningIn' } } }
      responses:
        '201': { description: Triagem registrada, content: { application/json: { schema: { $ref: '#/components/schemas/ScreeningResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /allocation:
    post:
      summary: Alocar participante (staff) — resposta NEUTRA, nunca revela o braço
      operationId: allocateParticipant
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AllocateIn' } } }
      responses:
        '201': { description: Alocado (confirmação neutra), content: { application/json: { schema: { $ref: '#/components/schemas/AllocationAccepted' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /allocation/{id}/unblind-request:
    post:
      summary: Solicitar desbloqueio de um participante (admin) — passo 1 de 2, NÃO revela
      operationId: unblindRequest
      description: >
        Passo 1 do desbloqueio em DUAS PESSOAS: um admin (`unblind:request`) abre um pedido
        justificado. NÃO revela a condição — apenas registra a pendência e audita o pedido
        (`unblind.requested`, sem a condição). A revelação só ocorre no passo 2 (`unblind-approve`),
        exigido a um SEGUNDO admin distinto. 409 se já houver pedido pendente ou já desbloqueado.
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnblindIn' } } }
      responses:
        '200': { description: Pedido registrado (aguarda 2º aprovador), content: { application/json: { schema: { $ref: '#/components/schemas/UnblindRequestResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /allocation/{id}/unblind-approve:
    post:
      summary: Aprovar desbloqueio (SEGUNDO admin) — passo 2 de 2, revela a condição
      operationId: unblindApprove
      description: >
        Passo 2 do desbloqueio em duas pessoas: um SEGUNDO admin (`unblind:request`), DISTINTO do
        solicitante, aprova o pedido pendente. Só aqui a condição (ativo/sham) é revelada, usando a
        chave selada; a auditoria registra `unblind.performed` (quem aprovou/quando) SEM a condição
        em claro. 409 se não houver pedido pendente, se o aprovador for o mesmo solicitante, ou se já
        desbloqueado. É o ÚNICO caminho da API para a condição.
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Condição revelada (ao 2º admin), content: { application/json: { schema: { $ref: '#/components/schemas/UnblindResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /research/export:
    post:
      summary: Solicitar exportação pseudonimizada (assíncrona) — RBAC
      operationId: requestExport
      description: >
        Solicita a exportação pseudonimizada (casos completos): sem PII e SEM a condição
        (ativo/sham) — só o braço CODIFICADO A/B, para a análise cega. Registrada em auditoria.
      responses:
        '202': { description: Aceito (processamento assíncrono), content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /research/export/{id}:
    get:
      summary: Status/arquivo da exportação (RBAC)
      operationId: getExport
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200':
          description: Concluída (CSV) ou status do job (JSON)
          content:
            text/csv: { schema: { type: string } }
            application/json: { schema: { $ref: '#/components/schemas/JobStatus' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /research/ml-features:
    get:
      summary: Dataset OFFLINE de features p/ ML (pseudonimizado, cego) — RBAC
      operationId: getMlFeatures
      description: >
        Consolida o recommendation_log + telemetria de sessão num CSV de features para
        pesquisa de modelos FUTURA (E4). Sempre OFFLINE — nada aqui decide; o recomendador
        segue por regras (inegociável #5). Sem PII (só o study_code pseudônimo; índice
        ordinal, não hora de parede) e SEM a condição (ativo/sham) — só o braço CODIFICADO
        A/B; o protocolo_sugerido é handle neutro de banda. Auditado. RBAC `export:request`.
      responses:
        '200':
          description: CSV de features (uma linha por recomendação)
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /research/audit:
    get:
      summary: Ler o log de auditoria (admin) — append-only, sem PII nem braço
      operationId: readAuditLog
      description: >
        Lista eventos de auditoria de ações sensíveis (consentimento, alocação e, quando
        implementados, pedido de exportação e desbloqueio). Somente admin (`audit:read`).
        Paginação por cursor keyset (mais recentes primeiro). O log é append-only e nunca
        contém PII em claro nem o braço (ativo/sham).
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /research/analysis:
    get:
      summary: Relatório de análise do piloto (viabilidade, Bang, exploratórios, progressão)
      operationId: getAnalysis
      description: >
        Relatório REPRODUZÍVEL e CEGO (por braço CODIFICADO A/B) — viabilidade/adesão/retenção,
        usabilidade (SUS), índice de Bang (cegamento), testes exploratórios (GAD-7/PSQI) e
        critérios de progressão pré-especificados (semáforo). Exploratório/gerador de hipóteses;
        NÃO decide eficácia nem desfecho ao vivo. RBAC `research:read`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AnalysisReport' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /staff:
    get:
      summary: Listar usuários de staff (admin)
      operationId: listStaff
      description: >
        Lista pesquisadores/admins com estado operacional (papel, MFA, ativo, último login).
        Somente admin (`user:manage`). Não devolve senha nem segredo de MFA.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StaffList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Criar usuário de staff (admin) — sem auto-registro público
      operationId: createStaff
      description: >
        Cria pesquisador/admin. Somente admin (`user:manage`); a senha é cifrada (argon2id).
        Omitir `password` **convida** a pessoa: a conta nasce sem senha utilizável e um link
        de definição de senha vai por e-mail (`invited: true` na resposta). O admin nunca vê
        o token — não pode, portanto, assumir a conta que criou.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffCreateIn' } } }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/StaffCreated' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /staff/{id}/password-reset:
    parameters: [ { $ref: '#/components/parameters/PathId' } ]
    post:
      summary: Disparar redefinição de senha de um staff (admin)
      operationId: requestStaffPasswordReset
      description: >
        Envia ao **e-mail do próprio staff** um link de uso único para redefinir a senha.
        O admin não escolhe nem recebe a senha e não vê o token: o objetivo é destravar quem
        perdeu o acesso, **não** dar ao admin um caminho para assumir a conta. Não altera o
        MFA — quem tinha segundo fator continua precisando dele. Conta desativada: 409.
        Auditado sem token e sem e-mail no registro.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequested' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /staff/setup-password:
    post:
      summary: Definir a senha com o token do convite/redefinição (público, sem autenticação)
      operationId: setupStaffPassword
      description: >
        Consome o token recebido por e-mail (convite ou redefinição) e grava a nova senha.
        Uso único, expira e tem limite de tentativas por IP. Resposta genérica em token
        inválido/expirado/consumido (401), para não revelar se existe. **Não** ativa nem
        desativa MFA. Auditado sem token e sem senha.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetupPasswordIn' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSet' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /staff/{id}/deactivate:
    parameters: [ { $ref: '#/components/parameters/PathId' } ]
    post:
      summary: Desativar um usuário de staff (admin)
      operationId: deactivateStaff
      description: >
        Suspende o acesso do staff: tokens já emitidos deixam de valer (o RBAC confere o
        estado no banco a cada requisição) e o login passa a falhar com 401 genérico.
        Um admin **não** pode desativar a si mesmo (evita lockout). Auditado, sem PII.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StaffStatus' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /staff/{id}/activate:
    parameters: [ { $ref: '#/components/parameters/PathId' } ]
    post:
      summary: Reativar um usuário de staff (admin)
      operationId: activateStaff
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StaffStatus' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /staff/me/password:
    post:
      summary: Rotacionar a própria senha (staff autenticado)
      operationId: rotateOwnPassword
      description: >
        Troca a senha exigindo a senha atual. A nova senha precisa diferir da atual (422).
        Revoga o token de acesso em uso — é preciso autenticar de novo. Auditado, sem PII.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRotateIn' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRotated' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /staff/me/mfa/enroll:
    post:
      summary: Iniciar cadastro de MFA (TOTP) — gera segredo e URI otpauth
      operationId: enrollMfa
      description: >
        Gera e guarda um segredo TOTP para o staff autenticado e devolve o `provisioning_uri`
        (QR). O MFA só é ATIVADO após confirmar um código válido (`/staff/me/mfa/confirm`).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollOut' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /staff/me/mfa/confirm:
    post:
      summary: Confirmar e ATIVAR o MFA com um código TOTP
      operationId: confirmMfa
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MfaConfirmIn' } } }
      responses:
        '200': { description: MFA ativado, content: { application/json: { schema: { $ref: '#/components/schemas/MfaConfirmed' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /wearables/readings:
    post:
      summary: Ingerir leituras de vestível (FC/sono) — seam desacoplado
      operationId: ingestWearableReadings
      description: >
        Recebe um lote de leituras de FC/sono JÁ normalizadas no device (HealthKit/Google Fit)
        e as encaminha a um adaptador desacoplado (WearableSink). No padrão (NullSink) nada é
        persistido — é o seam preparado, não a integração construída (E2/ADR-084). As leituras
        NÃO alimentam o recomendador ao vivo (inegociável #5) e nenhum valor entra em log
        (inegociável #6). Participante, RBAC `wearable:write`. Auditado (só a contagem).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WearableReadingsIn' } } }
      responses:
        '202': { description: Recebido, content: { application/json: { schema: { $ref: '#/components/schemas/WearableIngestResult' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    PathId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
  responses:
    Problem:
      description: Erro (application/problem+json, RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
      required: [title, status]
    FollowupIn:
      type: object
      properties:
        gad7_items: { type: array, items: { type: integer, minimum: 0, maximum: 3 }, minItems: 7, maxItems: 7 }
        psqi: { $ref: '#/components/schemas/PSQIIn' }
        sus_items: { type: array, items: { type: integer, minimum: 1, maximum: 5 }, minItems: 10, maxItems: 10 }
        blinding_guess: { type: string, enum: [A, B, nao_sei] }
      required: [gad7_items, psqi, sus_items, blinding_guess]
    FollowupOut:
      type: object
      properties:
        gad7_total: { type: integer }
        gad7_severity: { type: string }
        psqi_global: { type: integer }
        psqi_interpretation: { type: string }
        sus_score: { type: number }
        sus_band: { type: string }
        blinding_guess: { type: string }
        score_version: { type: string }
    RequestOtpIn:
      type: object
      properties: { study_code: { type: string } }
      required: [study_code]
    VerifyOtpIn:
      type: object
      properties:
        study_code: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
      required: [study_code, code]
    RecommendationRequest:
      type: object
      description: Contexto AUTORRELATADO. Sinais de segurança são derivados no servidor, não aqui.
      properties:
        goal: { type: string, enum: [sleep, anxiety] }
        sleep_issue: { type: [string, "null"], enum: [onset, maintenance, null] }
        time_of_day: { type: string, enum: [day, evening, night], default: evening }
      required: [goal]
    Recommendation:
      type: object
      description: >
        Handle de protocolo NEUTRO (nunca revela o braço). `suggested_protocol`/`band` são null
        quando `action` = no_recommendation (guardrail de contraindicação). Sempre acompanha aviso
        de ferramenta complementar e nota de evidência.
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [recommend, no_recommendation] }
        suggested_protocol: { type: [string, "null"] }
        band: { type: [string, "null"] }
        rule_id: { type: string }
        ruleset_version: { type: string }
        flag_review: { type: boolean }
        rationale: { type: string }
        evidence_note: { type: string }
        disclaimer: { type: string }
      required: [id, action, rule_id, ruleset_version, flag_review]
    AcceptRecommendationIn:
      type: object
      properties: { accepted: { type: boolean } }
      required: [accepted]
    AcceptRecommendationOut:
      type: object
      properties:
        id: { type: string, format: uuid }
        accepted: { type: boolean }
      required: [id, accepted]
    RecommendationCoherence:
      type: object
      description: >
        Relatório exploratório e CEGO (sem braço). `n`=0 quando não há recomendações efetivas.
        Médias de relaxamento são null até existir vínculo recomendação→sessão.
      properties:
        n: { type: integer }
        goal_alignment_rate: { type: [number, "null"] }
        acceptance_rate: { type: [number, "null"] }
        mean_relaxation_accepted: { type: [number, "null"] }
        mean_relaxation_rejected: { type: [number, "null"] }
      required: [n]
    DiaryIn:
      type: object
      properties:
        diary_date: { type: string, format: date }
        latency_min: { type: [integer, "null"], minimum: 0, maximum: 1440 }
        awakenings: { type: [integer, "null"], minimum: 0, maximum: 50 }
        duration_h: { type: [number, "null"], minimum: 0, maximum: 24 }
        quality: { type: [integer, "null"], minimum: 0, maximum: 4 }
      required: [diary_date]
    LoginIn:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
      required: [email, password]
    RefreshIn:
      type: object
      properties: { refresh_token: { type: string } }
      required: [refresh_token]
    LogoutIn:
      type: object
      description: "refresh_token opcional — se enviado, também é revogado."
      properties: { refresh_token: { type: [string, "null"] } }
    MfaIn:
      type: object
      properties:
        mfa_token: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
      required: [mfa_token, code]
    TokenResponse:
      type: object
      description: >
        Resposta do login/refresh/verify. Três desfechos possíveis para staff:
        (1) MFA ativo → `mfa_required: true` + `mfa_token` (troque por acesso em /auth/mfa/verify);
        (2) MFA ainda NÃO ativo → `mfa_enrollment_required: true` + `enrollment_token`
        (token de graça, SEM escopo: só habilita /staff/me/mfa/enroll e /confirm — MFA é
        obrigatório para staff); (3) fluxo já autenticado → `access_token`+`refresh_token`.
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer }
        mfa_required: { type: boolean }
        mfa_token: { type: string, description: "Desafio intermediário quando o MFA está ativo." }
        mfa_enrollment_required: { type: boolean, description: "Staff sem 2º fator: precisa cadastrar MFA." }
        enrollment_token: { type: string, description: "Token restrito ao cadastro de MFA (sem escopo)." }
      required: [token_type]
    ConsentIn:
      type: object
      properties:
        tcle_version:
          type: string
          examples: ["0.1.0-rascunho"]
          description: >
            Versão do termo que o participante leu. Precisa ser IGUAL à vigente (obtida em
            GET /participants/me/consent/_status); divergente → 409. É assim que uma revisão do
            texto invalida aceites contra a redação antiga, em vez de deixá-los ambíguos.
            O sufixo `-rascunho` marca texto AINDA NÃO aprovado pelo CEP (docs/tcle-rascunho.md).
        accepted: { type: boolean }
      required: [tcle_version, accepted]
    ConsentOut:
      type: object
      properties:
        id: { type: string, format: uuid }
        accepted_at: { type: string, format: date-time }
        content_hash: { type: string }
    ConsentWithdrawn:
      type: object
      description: "Consentimento retirado pelo titular; participação encerrada."
      properties:
        status: { type: string, enum: [withdrawn] }
        revoked_consents: { type: integer, minimum: 0, description: "quantos registros de consentimento foram marcados como revogados" }
        withdrawn_at: { type: string, format: date-time }
      required: [status, withdrawn_at]
    PSQIIn:
      type: object
      properties:
        subjective_quality: { type: integer, minimum: 0, maximum: 3 }
        latency_min: { type: integer, minimum: 0, maximum: 1440 }
        cannot_sleep_30min_freq: { type: integer, minimum: 0, maximum: 3 }
        hours_slept: { type: number, exclusiveMinimum: 0, maximum: 24 }
        hours_in_bed: { type: number, exclusiveMinimum: 0, maximum: 24, description: "derivado no cliente (deitar→levantar)" }
        disturbance_items:
          type: array
          items: { type: integer, minimum: 0, maximum: 3 }
          minItems: 9
          maxItems: 9
        medication_freq: { type: integer, minimum: 0, maximum: 3 }
        stay_awake_freq: { type: integer, minimum: 0, maximum: 3 }
        enthusiasm_problem: { type: integer, minimum: 0, maximum: 3 }
      required: [subjective_quality, latency_min, cannot_sleep_30min_freq, hours_slept, hours_in_bed, disturbance_items, medication_freq, stay_awake_freq, enthusiasm_problem]
    BaselineIn:
      type: object
      properties:
        gad7_items:
          type: array
          items: { type: integer, minimum: 0, maximum: 3 }
          minItems: 7
          maxItems: 7
        psqi: { $ref: '#/components/schemas/PSQIIn' }
      required: [gad7_items, psqi]
    ScoreOut:
      type: object
      properties:
        gad7_total: { type: integer }
        gad7_severity: { type: string }
        psqi_global: { type: integer }
        psqi_interpretation: { type: string }
        score_version: { type: string }
    HeadphoneCheck:
      type: object
      description: >-
        Resultado da VERIFICAÇÃO DICÓTICA de fones (o participante identifica em qual orelha
        soou um sinal de teste). Substitui a antiga declaração `headphones_ok`: a condição
        dicótica é pré-requisito do fenômeno binaural, então ela é testada, não declarada.
        O servidor recusa (422) uma sessão cuja verificação tenha falhado ou tenha rodadas de
        menos. O sinal de teste é o mesmo nos dois braços e não carrega informação de condição.
      properties:
        version: { type: string, description: "versão do procedimento (ex.: 1.0.0)" }
        rounds: { type: integer, minimum: 1, description: "desafios apresentados" }
        errors: { type: integer, minimum: 0, description: "respostas erradas NA TENTATIVA ACEITA (0)" }
        attempts:
          type: integer
          minimum: 1
          description: >-
            Tentativas até passar. Errar reinicia o teste, então a tentativa aceita tem sempre
            `errors: 0`; quantas foram necessárias é o que interessa à auditoria (fone invertido,
            saída em mono) e fica registrado aqui.
        ears:
          type: [string, "null"]
          description: "orelhas sorteadas, na ordem (ex.: \"LR\") — auditoria do sorteio"
      required: [version, rounds, errors]
    SafetyCheckIn:
      type: object
      properties:
        phq9_items:
          type: array
          items: { type: integer, minimum: 0, maximum: 3 }
          minItems: 9
          maxItems: 9
          description: "respostas 0–3 (o texto dos itens não vive no código)"
        gad7_items:
          type: [array, "null"]
          items: { type: integer, minimum: 0, maximum: 3 }
          minItems: 7
          maxItems: 7
          description: "opcional; GAD-7 >= 15 também aciona o fluxo de encaminhamento"
        moment:
          type: string
          enum: [intermediaria, espontanea]
          description: "T2 (intermediária) ou registro fora de janela"
      required: [phq9_items]
    SafetyCheckOut:
      type: object
      description: "Sem escore, de propósito — ver a descrição do endpoint."
      properties:
        status: { type: string, examples: [recorded] }
        referral_opened: { type: boolean, description: "true = fluxo de encaminhamento acionado" }
        guidance: { type: string, description: "orientação de cuidado, sempre presente" }
      required: [status, referral_opened, guidance]
    Referral:
      type: object
      properties:
        id: { type: string, format: uuid }
        study_code: { type: string, description: "pseudônimo — nunca nome/e-mail" }
        reasons:
          type: array
          items: { type: string, enum: [gad7_grave, phq9_item9, relato] }
        status: { type: string, enum: [aberto, encaminhado, acolhido] }
        service: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        referred_at: { type: [string, "null"], format: date-time }
        acknowledged_at: { type: [string, "null"], format: date-time }
      required: [id, study_code, reasons, status, created_at]
    ReferralPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Referral' } }
      required: [items]
    ReferralRecordIn:
      type: object
      properties:
        service: { type: string, enum: [apoio_institucional, caps, urgencia, outro] }
        acknowledged: { type: boolean, description: "true = houve confirmação de acolhimento" }
      required: [service]
    SessionIn:
      type: object
      properties:
        protocol_handle: { type: string, description: "handle neutro — não revela o braço" }
        headphone_check: { $ref: '#/components/schemas/HeadphoneCheck' }
        audio_gain:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Ganho digital TRAVADO com que o cliente vai reproduzir (0..1). O servidor recusa
            acima do teto configurado (`AUDIO_MAX_GAIN`) — é o "limite imposto por software"
            do protocolo, e o participante não tem como alterá-lo pelo aplicativo. O nível
            absoluto em dB(A) depende da calibração em acoplador de orelha.
        device_info: { type: object, additionalProperties: true }
        recommendation_id:
          type: [string, "null"]
          format: uuid
          description: "recomendação que originou a sessão (opcional; vincula p/ o relatório de coerência)"
      required: [protocol_handle, headphone_check, audio_gain]
    SessionOut:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        protocol_handle: { type: string, description: "banda neutra — idêntica nos dois braços" }
        content_hash: { type: string, description: "opaco; o cliente reproduz o arquivo bit-a-bit" }
        started_at: { type: string, format: date-time }
    SessionCompleteIn:
      type: object
      description: >-
        Telemetria do fim da sessão. Além do tempo efetivo e da contagem de interrupções,
        carrega o que o protocolo manda registrar por sessão (G10): a DURAÇÃO das
        interrupções, o volume médio e máximo efetivamente aplicados e o item único de
        percepção de relaxamento em escala de 0 a 10. Todos opcionais: um cliente antigo,
        ou um reenvio da fila offline gravada antes desta versão, continua encerrando a
        sessão — a adesão é desfecho primário e não pode se perder por um campo novo.
      properties:
        effective_seconds: { type: integer, minimum: 0, maximum: 86400 }
        interruptions: { type: integer, minimum: 0 }
        paused_seconds:
          type: [integer, "null"]
          minimum: 0
          maximum: 86400
          description: "tempo total em pausa (protocolo: 'interrupções e sua duração')"
        gain_mean:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1
          description: "ganho MÉDIO aplicado na reprodução"
        gain_peak:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1
          description: >-
            Ganho MÁXIMO aplicado. O teto de volume (G3) é reconferido aqui: acima de
            AUDIO_MAX_GAIN, ou abaixo de `gain_mean`, o encerramento é recusado com 422.
        relaxation_0_10:
          type: [integer, "null"]
          minimum: 0
          maximum: 10
          description: "item único de percepção de relaxamento, por sessão"
      required: [effective_seconds]
    SessionCompleteOut:
      type: object
      description: >-
        Resultado do encerramento. `counts_for_adherence` diz se a sessão atingiu 80% da
        duração prescrita e portanto conta para a adesão (desfecho primário). A régua é
        idêntica nos dois braços e nada aqui revela a condição.
      properties:
        status: { type: string, examples: [recorded] }
        effective_seconds: { type: integer }
        counts_for_adherence: { type: boolean }
      required: [status, effective_seconds, counts_for_adherence]
    SurveyIn:
      type: object
      properties:
        feeling: { type: integer, minimum: 0, maximum: 4 }
        relaxation: { type: integer, minimum: 0, maximum: 4 }
        slept_better: { type: [integer, "null"], minimum: 0, maximum: 4 }
        liked: { type: integer, minimum: 0, maximum: 4 }
        intensity: { type: integer, minimum: 0, maximum: 4 }
        would_repeat: { type: boolean }
      required: [feeling, relaxation, liked, intensity, would_repeat]
    AdverseEventAccepted:
      type: object
      description: "Confirmação com sinalização de atenção e orientação de cuidado."
      properties:
        status: { type: string, enum: [recorded] }
        requires_attention: { type: boolean }
        guidance: { type: string }
      required: [status, requires_attention, guidance]
    AdverseEventIn:
      type: object
      properties:
        type: { type: string }
        severity: { type: string, enum: [mild, moderate, severe] }
        session_id: { type: [string, "null"], format: uuid }
        action: { type: [string, "null"] }
      required: [type, severity]
    AdverseEvent:
      type: object
      description: "Um evento como a EQUIPE o vê: pseudonimizado, sem braço e sem PII."
      properties:
        id: { type: string, format: uuid }
        study_code: { type: string, description: "pseudônimo — nunca nome/e-mail" }
        type: { type: string }
        severity: { type: string, enum: [mild, moderate, severe] }
        action: { type: [string, "null"], description: "conduta relatada pelo participante" }
        outcome: { type: [string, "null"], description: "desfecho registrado pela equipe" }
        requires_attention: { type: boolean, description: "derivado da gravidade, não guardado" }
        session_id: { type: [string, "null"], format: uuid }
        occurred_at: { type: string, format: date-time }
      required: [id, study_code, type, severity, requires_attention, occurred_at]
    AdverseEventPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdverseEvent' } }
      required: [items]
    AdverseEventOutcomeIn:
      type: object
      properties:
        outcome: { type: string, minLength: 2, maxLength: 200 }
      required: [outcome]
    SessionPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionOut' } }
        next_cursor: { type: [string, "null"] }
      required: [items]
    SessionSummary:
      type: object
      description: >-
        Uma sessão como o PRÓPRIO participante a vê. Sem identificador do áudio, de propósito.
      properties:
        session_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        completed: { type: boolean, description: "contou para a adesão (>= 80% da duração)" }
        effective_seconds: { type: [integer, "null"] }
        relaxation_0_10: { type: [integer, "null"] }
      required: [session_id, started_at, completed]
    SessionSummaryPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
      required: [items]
    StaffSession:
      type: object
      description: >-
        Uma sessão como a EQUIPE a vê: o registro do protocolo, pseudonimizado e SEM nada do
        protocolo de áudio (item de cegamento).
      properties:
        session_id: { type: string, format: uuid }
        study_code: { type: string, description: "pseudônimo — nunca nome/e-mail" }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        completed: { type: boolean }
        effective_seconds: { type: [integer, "null"] }
        interruptions: { type: integer }
        paused_seconds: { type: [integer, "null"], description: "protocolo: interrupções E SUA DURAÇÃO" }
        audio_gain: { type: [number, "null"], description: "ganho travado declarado ao iniciar" }
        gain_mean: { type: [number, "null"], description: "volume MÉDIO aplicado" }
        gain_peak: { type: [number, "null"], description: "volume MÁXIMO aplicado" }
        relaxation_0_10: { type: [integer, "null"] }
        headphones_ok: { type: boolean, description: "derivado da verificação dicótica" }
      required: [session_id, study_code, started_at, completed, interruptions, headphones_ok]
    StaffSessionPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffSession' } }
      required: [items]
    ResearchParticipant:
      type: object
      properties:
        study_code: { type: string }
        arm_coded: { type: string, enum: [A, B] }
        adherence_pct: { type: number }
        adverse_events: { type: integer }
    ResearchPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ResearchParticipant' } }
        next_cursor: { type: [string, "null"] }
      required: [items]
    AuditEvent:
      type: object
      description: "Evento de auditoria — append-only, SEM PII e SEM o braço (ativo/sham)."
      properties:
        id: { type: string, format: uuid }
        action: { type: string, examples: [consent.recorded, allocation.created] }
        resource_type: { type: string }
        resource_id: { type: [string, "null"], format: uuid }
        actor_type: { type: string, enum: [participant, staff, system] }
        actor_id: { type: [string, "null"], format: uuid }
        occurred_at: { type: string, format: date-time }
        meta: { type: [object, "null"], additionalProperties: true }
      required: [id, action, resource_type, actor_type, occurred_at]
    AuditPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: [string, "null"] }
      required: [items]
    AllocateIn:
      type: object
      properties:
        participant_id: { type: string, format: uuid }
      required: [participant_id]
    ContactIn:
      type: object
      description: "PII do participante — cifrada em repouso no servidor; nunca ecoada de volta."
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
      required: [name, email]
    ScreeningIn:
      type: object
      description: >
        Critérios estruturados do protocolo aprovado. Elegível ⇔ todas as inclusões verdadeiras
        E nenhuma exclusão presente. `inclusion`/`exclusion` devem trazer o conjunto COMPLETO das
        chaves declaráveis (ver GET /screening/criteria); chave faltando, desconhecida ou
        derivada (`sintomas_elegiveis`, `d_gad7_grave_ou_risco`) é 422 — as derivadas o servidor
        calcula dos escores.
      properties:
        participant_id: { type: string, format: uuid }
        inclusion: { type: object, additionalProperties: { type: boolean } }
        exclusion: { type: object, additionalProperties: { type: boolean } }
        symptoms: { type: [object, "null"], additionalProperties: true }
        psqi_global:
          type: [integer, "null"]
          minimum: 0
          maximum: 21
          description: "PSQI global da triagem; > 5 satisfaz (com o GAD-7) a faixa sintomática de inclusão"
        phq9_items:
          type: [array, "null"]
          items: { type: integer, minimum: 0, maximum: 3 }
          minItems: 9
          maxItems: 9
          description: >-
            PHQ-9 de SEGURANÇA na triagem (não é desfecho). Item 9 positivo torna o candidato
            INELEGÍVEL e abre ficha de encaminhamento, como manda o protocolo.
        gad7_total:
          type: [integer, "null"]
          minimum: 0
          maximum: 21
          description: "GAD-7 da triagem; >= 15 é critério de exclusão e aciona encaminhamento"
      required: [participant_id, inclusion, exclusion]
    ScreeningResult:
      type: object
      properties:
        status: { type: string, enum: [screened] }
        eligible: { type: boolean }
        risk_detected: { type: boolean, description: "gatilho de segurança acionado na triagem" }
        unmet_criteria:
          type: array
          items: { type: string }
          description: "Chaves que barraram a inclusão (inclusão falsa ou exclusão presente)"
        referral_id: { type: [string, "null"], format: uuid }
      required: [status, eligible, risk_detected, unmet_criteria]
    ParticipantProgress:
      type: object
      description: >-
        Andamento no protocolo. Idêntico nos dois braços — nada aqui depende da condição.
      properties:
        status: { type: string, enum: [active, withdrawn, completed, removed, discontinued] }
        allocated: { type: boolean }
        study_day: { type: [integer, "null"], description: "dia de estudo (1 = dia da alocação)" }
        study_week: { type: [integer, "null"] }
        sessions_completed: { type: integer, description: "sessões com pelo menos 80% da duração" }
        sessions_prescribed: { type: integer }
        adherence_pct: { type: number }
        t2: { oneOf: [ { $ref: '#/components/schemas/T2Window' }, { type: "null" } ] }
        discontinuation: { oneOf: [ { $ref: '#/components/schemas/DiscontinuationBrief' }, { type: "null" } ] }
        hearing: { $ref: '#/components/schemas/HearingExposure' }
      required: [status, allocated, sessions_completed, sessions_prescribed, adherence_pct, hearing]
    HearingExposure:
      type: object
      description: >-
        Dose de exposição auditiva (G9). O protocolo promete "contabilização de dose
        acumulada" e "alerta ao atingir 50% do limite de referência" — 80 dB(A) por 40 h
        SEMANAIS (OMS/UIT, 2019). Por isso `alert` observa a janela móvel de 7 dias
        (`week_pct`), e não o acumulado do estudo (`total_pct`), que vai junto por ser a
        "dose acumulada" que o texto nomeia. `calibrated=false` significa que a calibração
        em acoplador de orelha ainda não foi feita e a dose é uma PREVISÃO no nível
        prescrito (`assumed_spl_dba`), não uma medida. Idêntico nos dois braços — a energia
        acústica é a mesma.
      properties:
        calibrated: { type: boolean }
        assumed_spl_dba:
          type: [number, "null"]
          description: "nível assumido quando não há calibração (60 dB(A), o prescrito)"
        reference_spl_dba: { type: number, examples: [80] }
        reference_hours_per_week: { type: number, examples: [40] }
        window_days: { type: integer, examples: [7] }
        week_hours: { type: number, description: "horas de reprodução efetiva nos últimos 7 dias" }
        week_pct: { type: number, description: "% da permissão semanal consumida na janela" }
        total_hours: { type: number }
        total_pct: { type: number, description: "% da permissão semanal, acumulado no estudo" }
        alert_at_pct: { type: number, examples: [50] }
        alert: { type: boolean, description: "week_pct atingiu alert_at_pct" }
      required: [calibrated, reference_spl_dba, reference_hours_per_week, window_days,
                 week_hours, week_pct, total_hours, total_pct, alert_at_pct, alert]
    T2Window:
      type: object
      description: "Avaliação intermediária da 2ª semana: quando abre, até quando, e se já foi feita."
      properties:
        opens_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        due: { type: boolean, description: "janela aberta e ainda não respondida" }
        late: { type: boolean, description: "janela fechada sem resposta" }
        completed: { type: boolean }
      required: [opens_at, closes_at, due, late, completed]
    DiscontinuationBrief:
      type: object
      properties:
        reason: { type: string, enum: [solicitacao_participante, evento_adverso, adesao_insuficiente] }
        decided_at: { type: string, format: date-time }
        kept_in_itt: { type: boolean, description: "sempre true — descontinuar não exclui da análise" }
      required: [reason, decided_at, kept_in_itt]
    DiscontinueIn:
      type: object
      description: >-
        Só os motivos que são juízo humano; `adesao_insuficiente` é regra do servidor.
      properties:
        reason: { type: string, enum: [solicitacao_participante, evento_adverso] }
        adverse_event_id: { type: [string, "null"], format: uuid }
      required: [reason]
    Discontinuation:
      type: object
      properties:
        id: { type: string, format: uuid }
        study_code: { type: string, description: "pseudônimo; nunca PII" }
        reason: { type: string, enum: [solicitacao_participante, evento_adverso, adesao_insuficiente] }
        study_week: { type: [integer, "null"] }
        sessions_completed: { type: [integer, "null"] }
        sessions_prescribed: { type: [integer, "null"] }
        kept_in_itt: { type: boolean }
        decided_at: { type: string, format: date-time }
      required: [id, study_code, reason, kept_in_itt, decided_at]
    DiscontinuationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Discontinuation' } }
      required: [items]
    DiscontinuationSweep:
      type: object
      properties:
        evaluated_at: { type: string, format: date-time }
        discontinued: { type: integer, description: "quantos a varredura descontinuou agora" }
      required: [evaluated_at, discontinued]
    ScreeningCriteria:
      type: object
      description: "Catálogo versionado dos critérios de elegibilidade em vigor."
      properties:
        version: { type: string }
        rule: { type: string }
        inclusion: { type: array, items: { $ref: '#/components/schemas/CriterionItem' } }
        exclusion: { type: array, items: { $ref: '#/components/schemas/CriterionItem' } }
        derived_from: { type: object, additionalProperties: { type: string } }
        note: { type: string }
      required: [version, rule, inclusion, exclusion]
    CriterionItem:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        derived: { type: boolean, description: "calculado pelo servidor; não declarar" }
      required: [key, label, derived]
    EraseResult:
      type: object
      properties:
        status: { type: string, enum: [erased] }
        removed: { type: object, additionalProperties: { type: integer } }
      required: [status, removed]
    SubjectData:
      type: object
      description: "Dados do titular (com PII do próprio). NUNCA contém o braço/condição."
      additionalProperties: true
      properties:
        profile: { type: object, additionalProperties: true }
        contact: { type: [object, "null"], additionalProperties: true }
    StaffCreateIn:
      type: object
      description: >
        `password` é opcional: sem ela, a conta é criada por CONVITE (link de definição de
        senha por e-mail) e nasce sem senha utilizável.
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 120 }
        role: { type: string, enum: [researcher, admin] }
        password: { type: string, minLength: 8, maxLength: 200, nullable: true }
      required: [email, role]
    StaffCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [researcher, admin] }
        invited:
          type: boolean
          description: "true quando a conta foi criada por convite (senha definida pela própria pessoa)."
      required: [id, email, role, invited]
    PasswordResetRequested:
      type: object
      description: "Link de redefinição enviado ao e-mail do staff. O token não aparece na resposta."
      properties:
        status: { type: string, enum: [reset_email_sent] }
        expires_at: { type: string, format: date-time }
      required: [status, expires_at]
    SetupPasswordIn:
      type: object
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        new_password: { type: string, minLength: 8, maxLength: 200 }
      required: [token, new_password]
    PasswordSet:
      type: object
      description: "Senha definida. Se a conta tinha MFA, ele continua exigido no login."
      properties:
        status: { type: string, enum: [password_set] }
        mfa_enabled: { type: boolean }
      required: [status, mfa_enabled]
    StaffSummary:
      type: object
      description: "Estado operacional do staff — sem senha, sem segredo de MFA."
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [researcher, admin] }
        mfa_enabled: { type: boolean }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, email, role, mfa_enabled, is_active, created_at]
    StaffList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffSummary' } }
      required: [items]
    StaffStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        is_active: { type: boolean }
      required: [id, is_active]
    PasswordRotateIn:
      type: object
      properties:
        current_password: { type: string, minLength: 8, maxLength: 200 }
        new_password: { type: string, minLength: 8, maxLength: 200 }
      required: [current_password, new_password]
    PasswordRotated:
      type: object
      description: "Senha trocada; o token de acesso usado na chamada foi revogado."
      properties: { status: { type: string, enum: [password_rotated] } }
      required: [status]
    MfaEnrollOut:
      type: object
      description: "provisioning_uri (otpauth://) para o app autenticador; secret para entrada manual."
      properties:
        provisioning_uri: { type: string }
        secret: { type: string }
      required: [provisioning_uri, secret]
    MfaConfirmIn:
      type: object
      properties: { code: { type: string, pattern: '^[0-9]{6}$' } }
      required: [code]
    MfaConfirmed:
      type: object
      properties: { mfa_enabled: { type: boolean, enum: [true] } }
      required: [mfa_enabled]
    AllocationAccepted:
      type: object
      description: "Confirmação neutra — deliberadamente SEM o braço (ocultação da alocação)."
      properties:
        status: { type: string, enum: [allocated] }
        block: { type: integer }
      required: [status, block]
    UnblindIn:
      type: object
      description: "Justificativa obrigatória do desbloqueio (auditada; nunca contém a condição)."
      properties:
        justification: { type: string, minLength: 10, maxLength: 500 }
      required: [justification]
    UnblindRequestResult:
      type: object
      description: "Passo 1: pedido registrado; NÃO contém a condição (aguarda 2º aprovador)."
      properties:
        participant_id: { type: string, format: uuid }
        status: { type: string, enum: [pending_approval] }
        requested_at: { type: string, format: date-time }
      required: [participant_id, status, requested_at]
    UnblindResult:
      type: object
      description: "Passo 2: condição revelada ao 2º admin — ÚNICO ponto onde a condição aparece na API."
      properties:
        participant_id: { type: string, format: uuid }
        condition: { type: string, enum: [active, sham] }
        unblinded_at: { type: string, format: date-time }
        justification: { type: string }
      required: [participant_id, condition, unblinded_at]
    JobAccepted:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed] }
      required: [job_id, status]
    JobStatus:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed] }
      required: [job_id, status]
    WearableReading:
      type: object
      description: "Leitura canônica de vestível, já normalizada no device. Sem PII direta."
      properties:
        kind: { type: string, enum: [heart_rate, sleep] }
        taken_at: { type: string, format: date-time }
        value: { type: number, minimum: 0, maximum: 100000 }
        unit: { type: string, minLength: 1, maxLength: 16 }
        source: { type: string, minLength: 1, maxLength: 32, description: "rótulo do provedor (healthkit/googlefit/manual)" }
      required: [kind, taken_at, value, unit, source]
    WearableReadingsIn:
      type: object
      properties:
        readings: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/WearableReading' } }
      required: [readings]
    WearableIngestResult:
      type: object
      description: "Contagem aceita. No NullSink (padrão) as leituras não são persistidas."
      properties:
        accepted: { type: integer, minimum: 0 }
      required: [accepted]
    AnalysisReport:
      type: object
      description: >
        Relatório cego por braço codificado (A/B). Estrutura aberta (seções descritivas);
        nunca contém a condição ativo/sham nem PII.
      additionalProperties: true
      properties:
        framing: { type: string }
        enrollment: { type: object, additionalProperties: true }
        feasibility: { type: object, additionalProperties: true }
        blinding: { type: object, additionalProperties: true }
        seguranca:
          type: object
          additionalProperties: true
          description: >-
            Eventos adversos graves, encaminhamentos (total/em aberto/com acolhimento
            confirmado) e retirados por segurança — o que o protocolo manda comunicar ao CEP
            no relatorio parcial. Só contagens agregadas.
        exploratory: { type: object, additionalProperties: true }
        progression: { type: object, additionalProperties: true }
