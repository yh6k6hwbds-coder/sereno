name: Build & Deploy (app)
# Gera o APK (artefato baixavel) e publica o build web no GitHub Pages, a cada push.
# As pastas nativas (android/web) sao geradas no CI com `flutter create` (nao ficam no repo).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# URL pública da API (backend na Fly.io). Definível sem editar este arquivo em
# Settings > Secrets and variables > Actions > Variables (API_BASE_URL). O default
# corresponde ao `app` do fly.toml. Sem isso o app cai no localhost e não conecta.
env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://sereno-piloto-api.fly.dev/v1' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
      - name: Gerar plataforma Android + dependencias
        run: cd app && flutter create --platforms=android --project-name sereno . && flutter pub get

      # `flutter create` declara INTERNET so nos manifestos de debug e profile; o de `main`,
      # que e o do build RELEASE, sai sem ela. Como a pasta android/ e regerada aqui a cada
      # execucao, todo APK release deste pipeline nascia SEM PERMISSAO DE REDE: o Android
      # bloqueava toda chamada antes de sair do aparelho e o app so dizia "falha de conexao".
      - name: Declarar a permissao de internet no manifesto de release
        run: |
          set -euo pipefail
          f=app/android/app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' "$f"; then
            echo "ja declarada"
          else
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$f"
            grep -q 'android.permission.INTERNET' "$f" || { echo "::error::nao consegui injetar a permissao em $f"; exit 1; }
            echo "permissao injetada"
          fi

      - name: Build do APK (release)
        run: cd app && flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      # Guard: sem isto o defeito volta em silencio na proxima vez que alguem mexer no passo
      # acima — e o sintoma (nada chega ao servidor) so aparece com o app ja na mao de alguem.
      - name: Conferir que o APK pede INTERNET
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          if unzip -p "$apk" AndroidManifest.xml | strings -el | grep -q 'android.permission.INTERNET'; then
            echo "APK declara android.permission.INTERNET"
          else
            echo "::error::o APK saiu SEM android.permission.INTERNET — nenhuma chamada de rede funcionaria."
            exit 1
          fi

      # Sem keystore, `flutter build apk --release` assina com a chave de DEBUG: publica, mas
      # a chave e publica, nenhuma loja aceita, e trocar de chave depois obriga o participante
      # a desinstalar (perdendo o cache cifrado de audio). O piloto distribui por link direto
      # (ADR-114), entao a assinatura propria e o que da identidade ao arquivo.
      - name: Assinar o APK para distribuicao (so com o keystore em segredo)
        id: assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: o APK sai com a chave de DEBUG e NAO deve ser distribuido (ver docs/distribuir-o-app.md)."
            echo "assinado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Segredo pela metade e pior que segredo nenhum: falharia so na hora de assinar,
          # depois de o build inteiro passar, e o artefato sairia com nome de confiavel.
          for v in STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 definido, mas falta $v."; exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > /tmp/sereno.jks
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner nao encontrado no runner."; exit 1; fi
          "$APKSIGNER" sign --ks /tmp/sereno.jks \
            --ks-pass "pass:$STORE_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out /tmp/sereno-assinado.apk "$APK"
          mv /tmp/sereno-assinado.apk "$APK"
          rm -f /tmp/sereno.jks
          # A impressao digital vai para o log de proposito: e por ela que a equipe confere,
          # antes de distribuir, que o arquivo saiu DAQUI e nao de outro lugar.
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" || true
          echo "assinado=true" >> "$GITHUB_OUTPUT"

      # O nome do artefato DIZ se ele pode ser distribuido. Um APK de debug com nome limpo e
      # exatamente o que alguem baixa com pressa e entrega a um participante.
      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.assinatura.outputs.assinado == 'true' && 'sereno-apk' || 'sereno-apk-DEBUG-NAO-DISTRIBUIR' }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Habilitar o GitHub Pages (auto, na 1a vez)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: subosito/flutter-action@v2
      - name: Gerar plataforma Web + dependencias
        run: cd app && flutter create --platforms=web --project-name sereno . && flutter pub get
      - name: Build web (base-href = /<repo>/ para o GitHub Pages)
        run: cd app && flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Empacotar para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
